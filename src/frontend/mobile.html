<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b4bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>记一笔 · 家庭账本</title>
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<header class="bar">
  <div class="brand">记一笔</div>
  <a class="link" href="./?desktop=1">电脑版</a>
</header>

<main>
  <section class="shot">
    <input type="file" id="m-file" accept="image/*" hidden>
    <button class="pick" id="m-pick" type="button">
      <span class="plus">＋</span>
      <span class="pick-text">拍照 / 选择账单</span>
    </button>
    <div id="m-preview" class="preview" hidden>
      <img id="m-img" alt="账单预览">
    </div>
    <p id="m-status" class="status"></p>
  </section>

  <section class="form" id="m-form" hidden>
    <div class="seg" id="m-type">
      <button type="button" data-type="expense" class="on">支出</button>
      <button type="button" data-type="income">收入</button>
    </div>

    <label class="field amount">
      <span>金额</span>
      <div class="amount-box">
        <em>¥</em>
        <input id="m-amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
      </div>
    </label>

    <label class="field">
      <span>时间</span>
      <input id="m-time" type="datetime-local">
    </label>

    <label class="field">
      <span>分类</span>
      <select id="m-category"></select>
    </label>

    <label class="field">
      <span>备注</span>
      <input id="m-note" type="text" placeholder="商户 / 说明" enterkeyhint="done">
    </label>

    <div class="items" id="m-items-wrap" hidden>
      <div class="items-title">已自动入库 <b id="m-items-count"></b></div>
      <ul id="m-items"></ul>
    </div>

    <button class="save" id="m-save" type="button">保存这笔</button>
    <p class="hint" id="m-today"></p>
  </section>
</main>

<div id="m-toast" class="toast"></div>
<script type="module" src="js/mobile.js"></script>
</body>
</html>
