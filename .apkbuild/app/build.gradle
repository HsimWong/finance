plugins {
    id 'com.android.application'
}

android {
    namespace 'com.familyfinance.ledger'
    compileSdk 34

    defaultConfig {
        applicationId 'com.familyfinance.ledger'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('../family-finance.jks')
            storePassword 'familyfinance2026'
            keyAlias 'finance'
            keyPassword 'familyfinance2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
